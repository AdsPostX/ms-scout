services:
  - type: worker
    name: ms-scout
    runtime: python
    region: oregon
    plan: starter          # $7/mo — never sleeps, auto-restarts on crash
    buildCommand: pip install -r requirements.txt
    startCommand: python scout_bot.py
    disk:
      name: scout-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1            # Persists data/ across deploys (state files, context, digests)
    envVars:
      - key: SCOUT_ENV
        value: production
      - key: PULSE_CHANNEL
        value: C06F1RPPVBL      # #revenue-operations
      - key: SCOUT_DIGEST_CHANNEL
        value: C0ARLAMDL1K      # #scout-offers
      # All secrets below — set these in Render dashboard, never commit values
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_APP_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CH_HOST
        sync: false
      - key: CH_USER
        sync: false
      - key: CH_PASSWORD
        sync: false
      - key: CH_DATABASE
        sync: false
      - key: IMPACT_SID
        sync: false
      - key: IMPACT_TOKEN
        sync: false
      - key: FLEXOFFERS_API_KEY
        sync: false
      - key: FLEXOFFERS_DOMAIN_ID
        sync: false
      - key: MAXBOUNTY_EMAIL
        sync: false
      - key: MAXBOUNTY_PASSWORD
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DB_ID
        sync: false
      - key: NOTION_QUEUE_DB_ID
        sync: false
      - key: MS_PLATFORM_URL
        sync: false
      - key: ADOPS_NOTIFY_USER_ID
        sync: false
      - key: GIPHY_API_KEY
        sync: false
      - key: SCOUT_ADMIN_USER_ID
        sync: false
      - key: SIDD_QA_CHANNEL_ID
        sync: false
      # Cross-service offer feed — set to ms-demand-feed internal URL once confirmed stable.
      # Leave unset (or "") to use disk fallback (current production behavior).
      - key: DEMAND_FEED_URL
        value: ""

  - type: web
    name: ms-demand-feed
    runtime: python
    region: oregon
    plan: starter          # $7/mo — never sleeps, auto-restarts on crash
    buildCommand: pip install -r requirements-demand-feed.txt
    startCommand: python demand_feed_main.py
    disk:
      name: demand-feed-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1            # Persists offers_latest.json + scraper_state.json across deploys
    envVars:
      - key: DEMAND_FEED_PORT
        value: "8080"
      # Slack — required for monitor alarms to post alerts
      - key: SLACK_BOT_TOKEN
        sync: false
      # Affiliate network credentials — set all in Render dashboard, never commit values
      - key: IMPACT_SID
        sync: false
      - key: IMPACT_TOKEN
        sync: false
      - key: FLEXOFFERS_API_KEY
        sync: false
      - key: FLEXOFFERS_DOMAIN_ID
        sync: false
      - key: MAXBOUNTY_EMAIL
        sync: false
      - key: MAXBOUNTY_PASSWORD
        sync: false
      # Optional networks (set when credentials are available — see Known Debt in CLAUDE.md)
      - key: CJ_API_KEY
        sync: false
      - key: CJ_WEBSITE_ID
        sync: false
      - key: CJ_PUBLISHER_ID
        sync: false
      - key: SHAREASALE_API_TOKEN
        sync: false
      - key: SHAREASALE_API_SECRET
        sync: false
      - key: RAKUTEN_API_TOKEN
        sync: false
      - key: AWIN_PUBLISHER_ID
        sync: false
      - key: AWIN_API_KEY
        sync: false
      # Notion — offer inventory database
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DB_ID
        sync: false
      # ClickHouse — campaign matching enrichment in offer_scraper.py
      - key: CH_HOST
        sync: false
      - key: CH_USER
        sync: false
      - key: CH_PASSWORD
        sync: false
      - key: CH_DATABASE
        sync: false
