services:
  - type: worker
    name: ms-scout
    runtime: python
    region: oregon
    plan: starter          # $7/mo — never sleeps, auto-restarts on crash
    buildCommand: pip install -r requirements.txt
    startCommand: python scout_bot.py
    disk:
      name: scout-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1            # Persists data/ across deploys (state files, context, digests)
    envVars:
      - key: SCOUT_ENV
        value: production
      # Phase 11 Block Kit visual upgrade — enable rich_text body + agent reasoning chain
      - key: SCOUT_MARKDOWN_BLOCKS
        value: "true"
      - key: SCOUT_AGENT_BLOCKS
        value: "true"
      - key: PULSE_CHANNEL
        value: C06F1RPPVBL      # #revenue-operations
      - key: SCOUT_DIGEST_CHANNEL
        value: C0ARLAMDL1K      # #scout-offers
      # All secrets below — set these in Render dashboard, never commit values
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_APP_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CH_HOST
        sync: false
      - key: CH_USER
        sync: false
      - key: CH_PASSWORD
        sync: false
      - key: CH_DATABASE
        sync: false
      - key: IMPACT_SID
        sync: false
      - key: IMPACT_TOKEN
        sync: false
      - key: FLEXOFFERS_API_KEY
        sync: false
      - key: FLEXOFFERS_DOMAIN_ID
        sync: false
      - key: MAXBOUNTY_EMAIL
        sync: false
      - key: MAXBOUNTY_PASSWORD
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DB_ID
        sync: false
      - key: NOTION_QUEUE_DB_ID
        sync: false
      - key: MS_PLATFORM_URL
        sync: false
      - key: ADOPS_NOTIFY_USER_ID
        sync: false
      - key: GIPHY_API_KEY
        sync: false
      - key: SCOUT_ADMIN_USER_ID
        sync: false
      - key: SIDD_QA_CHANNEL_ID
        sync: false
      # Cross-service offer feed — set to ms-demand-feed internal URL once confirmed stable.
      # Leave unset (or "") to use disk fallback (current production behavior).
      - key: DEMAND_FEED_URL
        value: ""

  - type: web
    name: ms-demand-feed
    runtime: python
    region: oregon
    plan: starter          # $7/mo — never sleeps, auto-restarts on crash
    buildCommand: pip install -r requirements-demand-feed.txt
    startCommand: python demand_feed_main.py
    disk:
      name: demand-feed-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1            # Persists offers_latest.json + scraper_state.json across deploys
    envVars:
      - key: DEMAND_FEED_PORT
        value: "8080"
      # Monitor routing — shadow/QA mode posts to #sidd-qa
      - key: SCOUT_HOURLY_SHADOW_ENABLED
        value: "true"
      - key: SCOUT_SHADOW_CHANNEL
        value: C0AQEECF800   # #sidd-qa
      # Revenue tracker — enabled
      - key: REVENUE_TRACKER_ENABLED
        value: "true"
      # Slack — required for monitor alarms to post alerts
      - key: SLACK_BOT_TOKEN
        sync: false
      # Affiliate network credentials — set all in Render dashboard, never commit values
      - key: IMPACT_SID
        sync: false
      - key: IMPACT_TOKEN
        sync: false
      - key: FLEXOFFERS_API_KEY
        sync: false
      - key: FLEXOFFERS_DOMAIN_ID
        sync: false
      - key: MAXBOUNTY_EMAIL
        sync: false
      - key: MAXBOUNTY_PASSWORD
        sync: false
      # Optional networks (set when credentials are available — see Known Debt in CLAUDE.md)
      - key: CJ_API_KEY
        sync: false
      - key: CJ_WEBSITE_ID
        sync: false
      - key: CJ_PUBLISHER_ID
        sync: false
      - key: SHAREASALE_API_TOKEN
        sync: false
      - key: SHAREASALE_API_SECRET
        sync: false
      - key: SHAREASALE_AFFILIATE_ID
        value: "3279349"
      - key: RAKUTEN_API_TOKEN
        sync: false
      - key: RAKUTEN_PUBLISHER_ID
        value: "3948979"
      - key: AWIN_PUBLISHER_ID
        sync: false
      - key: AWIN_API_KEY
        sync: false
      # TUNE network instances — add TUNE_{NAME}_NETWORK_ID + API_KEY + BASE_URL per instance
      - key: TUNE_ADACTION_NETWORK_ID
        value: "adactioninteractive"
      - key: TUNE_ADACTION_API_KEY
        sync: false
      - key: TUNE_ADACTION_BASE_URL
        value: "https://adactioninteractive.api.hasoffers.com"
      - key: TUNE_REVOFFERS_NETWORK_ID
        value: "7359"
      - key: TUNE_REVOFFERS_API_KEY
        sync: false
      - key: TUNE_REVOFFERS_BASE_URL
        value: "https://7359.api.hasoffers.com"
      - key: TUNE_KASHKICK_NETWORK_ID
        value: "kashkick"
      - key: TUNE_KASHKICK_API_KEY
        sync: false
      - key: TUNE_KASHKICK_BASE_URL
        value: "https://kashkick.hasoffers.com"
      - key: TUNE_BROWNBOOTS_NETWORK_ID
        value: ""
      - key: TUNE_BROWNBOOTS_API_KEY
        sync: false
      - key: TUNE_BROWNBOOTS_BASE_URL
        value: ""
      - key: TUNE_ADBLOOM_NETWORK_ID
        value: ""
      - key: TUNE_ADBLOOM_API_KEY
        sync: false
      - key: TUNE_ADBLOOM_BASE_URL
        value: ""
      - key: TUNE_SUCCESSFUL_MEDIA_NETWORK_ID
        value: ""
      - key: TUNE_SUCCESSFUL_MEDIA_API_KEY
        sync: false
      - key: TUNE_SUCCESSFUL_MEDIA_BASE_URL
        value: ""
      # Everflow network instances — add EVERFLOW_{NAME}_API_KEY + BASE_URL per instance
      - key: EVERFLOW_GIDDYUP_API_KEY
        sync: false
      - key: EVERFLOW_GIDDYUP_BASE_URL
        value: "https://giddyup.everflowclient.io"
      - key: EVERFLOW_ACCIOADS_API_KEY
        sync: false
      - key: EVERFLOW_ACCIOADS_BASE_URL
        value: "https://accioads.everflowclient.io"
      - key: EVERFLOW_KLAYMEDIA_API_KEY
        sync: false
      - key: EVERFLOW_KLAYMEDIA_BASE_URL
        value: "https://klaymedia.everflowclient.io"
      - key: EVERFLOW_CREDITCOM_API_KEY
        sync: false
      - key: EVERFLOW_CREDITCOM_BASE_URL
        value: "https://partners.credit.com"
      - key: EVERFLOW_MWKCONSULTING_API_KEY
        sync: false
      - key: EVERFLOW_MWKCONSULTING_BASE_URL
        value: "https://mwkconsulting.everflowclient.io"
      - key: EVERFLOW_PAWZITIVITY_API_KEY
        sync: false
      - key: EVERFLOW_PAWZITIVITY_BASE_URL
