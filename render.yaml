      - key: EVERFLOW_ARAGONPREMIUM_API_KEY
        sync: false
      - key: EVERFLOW_ARAGONPREMIUM_BASE_URL
        value: "https://aragonpremium.everflowclient.io"
      # Google Sheets legacy ID (used by old scraper; kept for reference)
